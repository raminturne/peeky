[package]
name = "peeky"
version = "2.1.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg"] }
webview2-com = "0.39"
windows-core = "0.62"
windows-future = "0.3"
ed25519-compact = { version = "2", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Foundation", "Foundation_Collections", "Storage_Streams", "ApplicationModel",
  "Media", "Media_Control", "UI_Notifications", "UI_Notifications_Management",
  "Devices_Enumeration", "Devices_Bluetooth", "Networking_Connectivity", "Media_Ocr", "Graphics_Imaging", "Globalization",
  "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock",
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Com_Urlmon",
  "Win32_System_DataExchange", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_LibraryLoader",
  "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_SystemInformation",
  "Win32_System_Threading", "Win32_System_Variant", "Win32_System_WinRT",
  "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia",
  "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Notifications",
  "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging",
  "Win32_Devices_FunctionDiscovery",
]

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"
tauri-plugin-global-shortcut = "2"
gtk = "0.18"
cairo-rs = "0.18"
gtk-layer-shell = { version = "0.8.2", features = ["v0_5", "v0_6"] }
gdkx11 = "0.18.2"
x11-dl = "2.21"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg"] }
ed25519-compact = { version = "2", default-features = false, features = ["std"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
debug = 0
incremental = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
