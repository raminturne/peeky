name: Deploy Persian documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whether GitHub Pages is enabled
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled yet. Set Settings > Pages > Source to GitHub Actions, then run this workflow again."
          fi

      - name: Configure Pages
        if: steps.detect.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        if: steps.detect.outputs.enabled == 'true'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        if: steps.detect.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: needs.build.outputs.enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
