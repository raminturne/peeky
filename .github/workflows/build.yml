name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        working-directory: src-tauri
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw "tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version" }
          New-Item -ItemType Directory -Force dist | Out-Null
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress; }
          & $nsis /V2 "/DVERSION=$version" installer/island.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          Copy-Item src-tauri/target/release/peeky.exe dist/Peeky-Portable.exe
          New-Item -ItemType Directory -Force dist/zip | Out-Null
          Copy-Item src-tauri/target/release/peeky.exe dist/zip/Peeky.exe
          Copy-Item LICENSE, README.md dist/zip/
          Compress-Archive -Path dist/zip/* -DestinationPath dist/Peeky-Windows.zip
          Remove-Item -Recurse dist/zip
          @{ version = $version; published = (Get-Date).ToUniversalTime().ToString('o') } | ConvertTo-Json | Set-Content dist/latest.json -Encoding utf8NoBOM
          Get-ChildItem dist | Format-Table Name, Length
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Sign the installer
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PEEKY_SIGN_KEY: ${{ secrets.PEEKY_SIGN_KEY }}
        run: node installer/sign.mjs dist/Peeky-Setup.exe

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS-Windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Peeky-Windows
          path: dist/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libxdo-dev libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-layer-shell-dev libsecret-1-dev python3-pil

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "2.12.4" --locked

      - name: Generate Linux PNG icons from the existing Windows icon
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Image.open("src-tauri/icons/icon.ico").convert("RGBA")
          sizes = {
              "32x32.png": 32,
              "128x128.png": 128,
              "128x128@2x.png": 256,
              "icon.png": 512,
          }
          # Pillow < 9.1 exposes LANCZOS directly on Image; newer releases moved
          # resampling filters under Image.Resampling. Support both runner versions.
          lanczos = getattr(Image, "Resampling", Image).LANCZOS
          for filename, size in sizes.items():
              target = Path("src-tauri/icons") / filename
              source.resize((size, size), lanczos).save(target, format="PNG")
          PY

      - name: Build and package Debian application
        working-directory: src-tauri
        env:
          PEEKY_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          cargo metadata --format-version 1 --locked > /dev/null
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo version ${version}" >&2
            exit 1
          fi
          cargo tauri build --bundles deb -- --locked
          mkdir -p ../dist
          cp target/release/bundle/deb/*.deb ../dist/
          cd ../dist
          deb="$(basename "$(find . -maxdepth 1 -type f -name '*.deb' -print -quit)")"
          test -n "$deb"
          printf '{"version":"%s","file":"%s"}\n' "$version" "$deb" > latest-linux.json
          sha256sum *.deb > SHA256SUMS-Linux.txt
          ls -lh

      - name: Sign Linux package
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        env:
          PEEKY_SIGN_KEY: ${{ secrets.PEEKY_SIGN_KEY }}
        run: |
          deb="$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          node installer/sign.mjs "$deb"

      - uses: actions/upload-artifact@v4
        with:
          name: Peeky-Linux
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: find dist -maxdepth 1 -type f -printf '%f (%s bytes)\n'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Peeky ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
